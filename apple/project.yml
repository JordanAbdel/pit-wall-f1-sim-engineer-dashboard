# Native PitWall app. Regenerate the Xcode project after editing:
#   cd apple && xcodegen
name: PitWall
options:
  bundleIdPrefix: com.jordanabdel
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set to your Team ID (developer.apple.com → Membership) to sign with
    # your Apple Development / Developer ID certificates. Empty = run locally.
    DEVELOPMENT_TEAM: ""
targets:
  PitWall:
    type: application
    platform: macOS
    sources:
      - path: PitWallMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordanabdel.pitwall
        PRODUCT_NAME: PitWall
        INFOPLIST_FILE: PitWallMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: PitWallMac/PitWall.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        # embed_engine.sh copies dist/PitWall from outside the project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Debug builds without a frozen engine run the source checkout's
        # build-venv instead (see Engine.swift), so no PyInstaller step
        # is needed while iterating.
        Debug:
          PITWALL_SOURCE_DIR: "$(SRCROOT)/.."
        Release:
          PITWALL_SOURCE_DIR: ""
    postBuildScripts:
      - name: Embed PitWall engine
        path: scripts/embed_engine.sh
        basedOnDependencyAnalysis: false
